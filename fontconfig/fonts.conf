<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <match target="font">
        <test name="family" qual="any">
            <string>Perfect DOS VGA 437</string>
        </test>
        <edit name="antialias" mode="assign">
            <bool>false</bool>
        </edit>
        <!-- Optional: Disable hinting for even crisper, less warped pixels -->
        <edit name="hinting" mode="assign">
            <bool>false</bool>
        </edit>
    </match>
</fontconfig>

