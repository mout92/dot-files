font:
  size: 14.0
  normal:
    family: "monospace"

window:
  dimensions:
    columns: 120
    lines: 35
  padding:
    x: 8
    y: 8

colors:
  primary:
    background: '0x000000'
    foreground: '0xffffd7'

  normal:
    black:   '0x000000'
    red:     '0xaf5f5f'
    green:   '0x5f875f'
    yellow:  '0x87875f'
    blue:    '0x5f87af'
    magenta: '0x5f5f87'
    cyan:    '0x5f8787'
    white:   '0x6c6c6c'

  bright:
    black:   '0x444444'
    red:     '0xff8700'
    green:   '0x87af87'
    yellow:  '0xffffaf'
    blue:    '0x8fafd7'
    magenta: '0x8787af'
    cyan:    '0x5fafaf'
    white:   '0xffffd7'
