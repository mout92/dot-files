[font]
size = 16.0

[font.normal]
family = "Fira Code"
style = "SemiBold"

[window]
dimensions = { columns = 120, lines = 40}
padding = { x = 8, y = 8 }
decorations = "none"

# Gruvbox Material Dark
[colors.primary]
background = "#1d2021"
foreground = "#d4be98"

[colors.normal]
black   = "#32302f"
red     = "#ea6962"
green   = "#a9b665"
yellow  = "#d8a657"
blue    = "#7daea3"
magenta = "#d3869b"
cyan    = "#89b482"
white   = "#d4be98"

[colors.bright]
black   = "#32302f"
red     = "#ea6962"
green   = "#a9b665"
